<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — BloomBox Ranchi (Instant Delivery)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0c831f;
      --primary-hover: #096918;
      --primary-light: #e8f7ed;
      --primary-glow: rgba(12, 131, 31, 0.28);
      --frozen-cyan: #0284c7;
      --frozen-cyan-light: #e0f2fe;
      --gold: #f8cb46;
      --gold-hover: #d97706;
      --cream: #f4f6fb;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.95);
      --surface-border: rgba(12, 131, 31, 0.2);
      --ink: #1c1c1c;
      --ink-muted: #666666;
      --ink-light: #9d8b9e;
      --shadow-sm: 0 4px 16px rgba(190, 24, 93, 0.05);
      --shadow-md: 0 12px 36px rgba(190, 24, 93, 0.1);
      --shadow-lg: 0 24px 60px rgba(190, 24, 93, 0.15);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --cream: #120a16;
      --surface: #1d1222;
      --surface-glass: rgba(29, 18, 34, 0.9);
      --surface-border: rgba(244, 114, 182, 0.2);
      --ink: #fdf7fc;
      --ink-muted: #baa8bd;
      --ink-light: #7b697d;
      --primary-light: #291222;
      --frozen-cyan-light: #0d1e2e;
      background: #120a16;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(120% 90% at 50% 0%, #fdf2f8 0%, #faeaf4 35%, #edf5fc 70%, #fbf3f8 100%), #fdf4f8;
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
    }

    h1, h2, h3, .serif {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Background Aesthetic Glows */
    .bg-glow-1 {
      position: fixed;
      top: -100px;
      left: 10%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.28) 0%, rgba(251, 207, 232, 0.12) 50%, transparent 70%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow-2 {
      position: fixed;
      bottom: -100px;
      right: 10%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.24) 0%, rgba(224, 242, 254, 0.1) 50%, transparent 70%);
      filter: blur(75px);
      z-index: 0;
      pointer-events: none;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }
    .logo-badge {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #fdf0f5, #f5d4e3);
      border: 1px solid #ecc2d6;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(133,33,76,0.1);
    }
    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      color: var(--primary);
    }
    .brand-title span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: var(--gold);
      font-size: 20px;
    }
    .brand-subtitle {
      font-size: 9.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 700;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      transition: var(--transition);
    }
    .btn-text:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      transition: var(--transition);
    }
    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      width: 100%;
      max-width: 490px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(190, 24, 93, 0.12), 0 0 25px rgba(56, 189, 248, 0.1);
      padding: 36px 32px;
      position: relative;
      animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--primary-light);
      border: 1px solid rgba(133, 33, 76, 0.15);
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 14px;
    }

    .auth-header h1 {
      font-size: 30px;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .auth-header p {
      font-size: 13.5px;
      color: var(--ink-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Tabs */
    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--primary-light);
      padding: 5px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
    }
    .auth-tab {
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
      font-family: inherit;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Form Fields */
    label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-muted);
      display: block;
      margin: 16px 0 6px;
    }
    label:first-child { margin-top: 0; }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .phone-prefix {
      padding: 12px 14px;
      background: var(--primary-light);
      border: 1px solid var(--surface-border);
      border-right: none;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      font-weight: 700;
      color: var(--primary);
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--ink);
      font-size: 14.5px;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }
    .phone-input {
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      letter-spacing: 1px;
      font-weight: 600;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 14px;
      padding: 4px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--primary), #9c2859);
      color: #ffffff;
      padding: 13px 24px;
      border: none;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: var(--transition);
      font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-hover), #821f49);
      box-shadow: 0 8px 24px var(--primary-glow);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Sub-toggle inside Email (Sign In vs Register) */
    .subtoggle {
      display: flex;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 16px;
    }
    .subtoggle-btn {
      flex: 1;
      padding: 8px 12px;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
      transition: var(--transition);
    }
    .subtoggle-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* OTP Area */
    .otp-stage {
      margin-top: 18px;
      padding: 16px;
      background: var(--primary-light);
      border-radius: var(--radius-md);
      border: 1px dashed rgba(133, 33, 76, 0.25);
      animation: fadeIn 0.3s ease;
    }
    .otp-input {
      font-size: 24px;
      letter-spacing: 10px;
      text-align: center;
      font-weight: 800;
      background: var(--surface);
    }
    .hint-box {
      margin: 12px 0 6px;
      padding: 8px 12px;
      background: rgba(191, 161, 95, 0.15);
      border: 1px solid rgba(191, 161, 95, 0.35);
      border-radius: 10px;
      font-size: 12px;
      color: var(--ink);
    }

    /* Divider */
    .divider {
      position: relative;
      text-align: center;
      margin: 24px 0 20px;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--surface-border);
    }
    .divider span {
      position: relative;
      background: var(--surface);
      padding: 0 12px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-light);
    }

    /* 1-Click Demo Profiles */
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .demo-btn {
      background: var(--cream);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
      font-family: inherit;
    }
    .demo-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
    }
    .demo-avatar {
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .demo-info strong {
      font-size: 12.5px;
      color: var(--ink);
      display: block;
      line-height: 1.2;
    }
    .demo-info small {
      font-size: 10.5px;
      color: var(--ink-muted);
      display: block;
    }

    /* Google Button */
    .google-btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--ink);
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      font-family: inherit;
    }
    .google-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Logged In Card State */
    .logged-in-view {
      text-align: center;
      padding: 10px 0;
    }
    .profile-avatar-big {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #fdf0f5, #f5d4e3);
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      margin: 0 auto 16px;
      box-shadow: var(--shadow-md);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--ink);
      color: #fff;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .auth-card { padding: 26px 20px; }
      .demo-grid { grid-template-columns: 1fr; }
      .top-bar { padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Header -->
  <header class="top-bar">
    <a href="/" class="brand-logo">
      <div class="logo-badge">🌷</div>
      <div>
        <div class="brand-title">Bloom<span>Box</span></div>
        <div class="brand-subtitle">Haute Gifting Atelier</div>
      </div>
    </a>
    <div class="top-actions">
      <a href="/" class="btn-text">
        <span>←</span>
        <span>Back to Boutique</span>
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light">◐</button>
    </div>
  </header>

  <!-- Auth Wrap -->
  <main class="auth-wrap">
    <div class="auth-card" id="authCard">
      <!-- Dynamic View (Rendered by JS: Active Login Form OR Logged In Card) -->
    </div>
  </main>

  <div id="toast"></div>

  <script>
    // Storage Utilities matching BloomBox conventions
    const read = (k, d) => { try { return JSON.parse(localStorage.getItem('bb_' + k)) ?? d; } catch { return d; } };
    const write = (k, v) => { try { localStorage.setItem('bb_' + k, JSON.stringify(v)); } catch {} };

    let profile = read('profile', null);
    let activeTab = 'otp'; // 'otp' or 'email'
    let emailMode = 'login'; // 'login' or 'signup'
    let resendTimer = null;

    // Theme Management
    if (localStorage.getItem('bb_dark') === '1') {
      document.body.classList.add('dark');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark');
      localStorage.setItem('bb_dark', document.body.classList.contains('dark') ? '1' : '0');
    }

    // Toast
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3200);
    }

    // API helper
    async function apiRequest(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Server error (' + res.status + ')');
      return data;
    }

    // Main Renderer
    function render() {
      const container = document.getElementById('authCard');
      if (profile) {
        renderLoggedIn(container);
      } else {
        renderAuthForm(container);
      }
    }

    // View: Logged In State
    function renderLoggedIn(container) {
      const wallet = read('wallet', 250);
      const points = read('points', 120);
      const isAdmin = Boolean(localStorage.getItem('bb_admin_token'));
      container.innerHTML = `
        <div class="logged-in-view">
          <div class="auth-eyebrow">${isAdmin ? '👑 ATELIER ADMIN PRIVILEGES' : '✦ CLIENT ATELIER PROFILE'}</div>
          <div class="profile-avatar-big">${isAdmin ? '👑' : '🌷'}</div>
          <h1 class="serif" style="font-size:28px;margin-bottom:4px">Namaste, ${escapeHtml(profile.name)}</h1>
          <p style="color:var(--ink-muted);font-size:13.5px;margin-bottom:20px">${escapeHtml(profile.phone || profile.email || 'Client')}</p>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
            <div style="background:var(--primary-light);padding:14px;border-radius:14px;text-align:center">
              <b style="font-size:22px;color:var(--primary)">₹${wallet}</b>
              <div style="font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-top:2px">Atelier Wallet</div>
            </div>
            <div style="background:var(--gold-light);padding:14px;border-radius:14px;text-align:center">
              <b style="font-size:22px;color:var(--gold)">✦ ${points}</b>
              <div style="font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-top:2px">Bloom Points</div>
            </div>
          </div>

          <!-- Admin Status Box inside Profile -->
          <div style="margin-bottom:20px;padding:14px;background:linear-gradient(135deg, rgba(190, 24, 93, 0.08), rgba(2, 132, 199, 0.08));border-radius:14px;border:1px solid var(--surface-border);text-align:left">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <span style="font-weight:800;font-size:12.5px;color:var(--primary);display:flex;align-items:center;gap:6px">
                <span>⚙️</span> Atelier Admin Portal
              </span>
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:${isAdmin ? 'var(--success)' : 'var(--ink-muted)'}">
                <span style="width:7px;height:7px;border-radius:50%;background:${isAdmin ? 'var(--success)' : '#9ca3af'}"></span>
                ${isAdmin ? 'Logged In (Admin)' : 'Not Logged In'}
              </span>
            </div>
            ${isAdmin ? `
              <p style="font-size:12px;color:var(--ink-muted);margin-bottom:12px">Manage live orders, update delivery dispatch, edit product stock & pricing.</p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <a href="/admin" class="btn-submit" style="margin-top:0;padding:9px 12px;font-size:12px;text-decoration:none;justify-content:center">Launch Admin ↗</a>
                <button type="button" class="btn-secondary" style="font-size:12px;color:var(--danger);border-color:rgba(220,38,38,0.3);font-weight:700;justify-content:center" onclick="signOutAdmin()">Admin Logout</button>
              </div>
            ` : `
              <p style="font-size:12px;color:var(--ink-muted);margin-bottom:12px">Sign in as Administrator to access orders, stock, and store controls.</p>
              <div style="display:flex;gap:8px">
                <button type="button" class="btn-submit" style="margin-top:0;padding:9px 12px;font-size:12px;flex:1;justify-content:center" onclick="switchTab('admin')">Admin Login 🔐</button>
                <a href="/admin" class="btn-secondary" style="text-decoration:none;font-size:12px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center">Go to /admin ↗</a>
              </div>
            `}
          </div>

          <button class="btn-submit" onclick="returnToBoutique()" style="margin-top:0">
            <span>Continue Shopping in Boutique</span>
            <span>🛍</span>
          </button>

          <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
            <button class="btn-text" onclick="signOutAccount()" style="color:var(--primary)">
              <span>Sign Out / Switch Account</span>
            </button>
          </div>
        </div>
      `;
    }

    // View: Sign In / Register Form
    function renderAuthForm(container) {
      container.innerHTML = `
        <div class="auth-header">
          <div class="auth-eyebrow">⚡ INSTANT DELIVERY SIGN IN</div>
          <h1 class="serif" style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900">Welcome to BloomBox</h1>
          <p>Sign in with your mobile number to access your instant grocery orders in Ranchi.</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab ${activeTab === 'otp' ? 'active' : ''}" onclick="switchTab('otp')">
            <span>📱</span>
            <span>SMS OTP</span>
          </button>
          <button class="auth-tab ${activeTab === 'email' ? 'active' : ''}" onclick="switchTab('email')">
            <span>✉️</span>
            <span>Email</span>
          </button>
          <button class="auth-tab ${activeTab === 'admin' ? 'active' : ''}" onclick="switchTab('admin')">
            <span>⚙️</span>
            <span>Admin</span>
          </button>
        </div>

        <!-- Tab 1: OTP -->
        <div id="otpTabContent" style="display:${activeTab === 'otp' ? 'block' : 'none'}">
          <label for="phoneInput">Mobile Number</label>
          <div class="input-wrap">
            <span class="phone-prefix">+91</span>
            <input id="phoneInput" class="phone-input" type="tel" maxlength="10" placeholder="10-digit mobile number" inputmode="numeric">
          </div>
          <p style="font-size:12px;color:var(--ink-muted);margin-top:6px">We'll dispatch a one-time verification code via live Twilio SMS.</p>
          <button id="sendOtpBtn" class="btn-submit" onclick="handleSendOtp()">
            <span>Send Verification Code</span>
            <span>→</span>
          </button>
          <div id="otpStageArea"></div>
        </div>

        <!-- Tab 2: Email -->
        <div id="emailTabContent" style="display:${activeTab === 'email' ? 'block' : 'none'}">
          <div class="subtoggle">
            <button class="subtoggle-btn ${emailMode === 'login' ? 'active' : ''}" onclick="switchEmailMode('login')">Sign In</button>
            <button class="subtoggle-btn ${emailMode === 'signup' ? 'active' : ''}" onclick="switchEmailMode('signup')">Create Account</button>
          </div>

          <div id="signupNameWrap" style="display:${emailMode === 'signup' ? 'block' : 'none'}">
            <label for="emailNameInput">Full Name</label>
            <input id="emailNameInput" type="text" placeholder="e.g. Priya Sharma">
          </div>

          <label for="emailInput">Email Address</label>
          <input id="emailInput" type="email" placeholder="name@example.com">

          <label for="passwordInput">Password</label>
          <div class="input-wrap">
            <input id="passwordInput" type="password" placeholder="••••••••">
            <button class="pwd-toggle-btn" type="button" onclick="togglePasswordVisibility()">👁</button>
          </div>

          <button id="emailSubmitBtn" class="btn-submit" onclick="handleEmailSubmit()">
            <span>${emailMode === 'signup' ? 'Create Account & Continue' : 'Sign In to Atelier'}</span>
            <span>→</span>
          </button>
        </div>

        <!-- Tab 3: Admin -->
        <div id="adminTabContent" style="display:${activeTab === 'admin' ? 'block' : 'none'}">
          <div style="padding:12px;background:var(--primary-light);border-radius:12px;border:1px solid var(--surface-border);margin-bottom:16px;font-size:12.5px;color:var(--ink)">
            👑 <b>Atelier Administrator Login:</b> Access dashboard, inventory stock, order stages, and live payment gateways.
          </div>
          <label for="adminPasswordInput">Admin Password</label>
          <div class="input-wrap">
            <input id="adminPasswordInput" type="password" placeholder="Enter admin password (e.g. admin123)" onkeydown="if(event.key==='Enter')handleAdminSubmit()">
          </div>

          <button id="adminSubmitBtn" class="btn-submit" onclick="handleAdminSubmit()">
            <span>Sign In to Admin Portal</span>
            <span>⚡</span>
          </button>

          <div style="margin-top:12px">
            <button type="button" class="btn-secondary" style="width:100%;justify-content:center;font-size:12px" onclick="document.getElementById('adminPasswordInput').value='admin123';handleAdminSubmit()">
              ⚡ 1-Click Fill Demo Credentials (admin123)
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span>or 1-click test login</span>
        </div>

        <!-- 1-Click Demo Profiles -->
        <div class="demo-grid">
          <div class="demo-btn" onclick="quickLogin('priya')">
            <div class="demo-avatar">🌸</div>
            <div class="demo-info">
              <strong>Priya Sharma</strong>
              <small>VIP Client · +91 98765 43210</small>
            </div>
          </div>
          <div class="demo-btn" onclick="quickLogin('rahul')">
            <div class="demo-avatar">🍫</div>
            <div class="demo-info">
              <strong>Rahul Verma</strong>
              <small>Express Gifter · +91 91234 56789</small>
            </div>
          </div>
        </div>

        <!-- Google Login -->
        <button class="google-btn" onclick="quickLogin('priya')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.5 0 12.8s.6 4.5 1.6 6.4l3.7-4.5z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16.4C3.5 20.2 7.4 23.5 12 23.5z"/></svg>
          <span>Continue with Google</span>
        </button>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      render();
    }

    function switchEmailMode(mode) {
      emailMode = mode;
      render();
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    }

    // OTP Handlers
    async function handleSendOtp() {
      const input = document.getElementById('phoneInput');
      const phone = input ? input.value.trim().replace(/\D/g, '') : '';
      if (!/^[6-9]\d{9}$/.test(phone)) {
        return toast('Please enter a valid 10-digit mobile number');
      }

      const btn = document.getElementById('sendOtpBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Dispatching Twilio SMS…'; }

      try {
        const res = await apiRequest('/api/auth/send-otp', {
          method: 'POST',
          body: JSON.stringify({ phone })
        });

        toast(res.smsSent ? 'OTP dispatched via Twilio SMS!' : 'OTP generated');
        if (btn) btn.style.display = 'none';

        const hint = res.devOtp ? `
          <div class="hint-box">
            <b>Live Code:</b> <b>${res.devOtp}</b> (Valid 10 mins)
          </div>
        ` : '';

        const area = document.getElementById('otpStageArea');
        area.innerHTML = `
          <div class="otp-stage">
            <label style="margin-top:0">Enter 6-Digit OTP</label>
            <input id="otpVerifyInput" class="otp-input" maxlength="6" inputmode="numeric" placeholder="••••••">
            ${hint}
            <button id="verifyOtpBtn" class="btn-submit" style="margin-top:14px" onclick="handleVerifyOtp('${phone}')">
              <span>Verify & Access Account</span>
              <span>✓</span>
            </button>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px">
              <span id="resendCountdown" style="color:var(--ink-muted)"></span>
              <button class="btn-text" id="resendSmsBtn" style="padding:4px 8px;font-size:11.5px;display:none" onclick="handleSendOtp()">Resend Code</button>
            </div>
          </div>
        `;

        let count = 30;
        const countdownEl = document.getElementById('resendCountdown');
        const resendBtn = document.getElementById('resendSmsBtn');
        countdownEl.textContent = 'Resend in ' + count + 's';
        clearInterval(resendTimer);
        resendTimer = setInterval(() => {
          count--;
          if (count <= 0) {
            clearInterval(resendTimer);
            countdownEl.textContent = '';
            resendBtn.style.display = 'inline-block';
          } else {
            countdownEl.textContent = 'Resend in ' + count + 's';
          }
        }, 1000);

        const verifyInput = document.getElementById('otpVerifyInput');
        if (verifyInput) verifyInput.focus();
      } catch (err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Send Verification Code'; }
        toast(err.message);
      }
    }

    async function handleVerifyOtp(phone) {
      const input = document.getElementById('otpVerifyInput');
      const otp = input ? input.value.trim() : '';
      if (!otp) return toast('Please enter the 6-digit OTP');

      const btn = document.getElementById('verifyOtpBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Verifying Code…'; }

      try {
        const res = await apiRequest('/api/auth/verify-otp', {
          method: 'POST',
          body: JSON.stringify({ phone, otp })
        });
        loginSuccess(res.profile);
      } catch (err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Verify & Access Account'; }
        toast(err.message);
      }
    }

    // Email Handlers
    async function handleEmailSubmit() {
      const email = document.getElementById('emailInput')?.value.trim();
      const password = document.getElementById('passwordInput')?.value.trim();
      const name = document.getElementById('emailNameInput')?.value.trim();

      if (!email || !email.includes('@')) return toast('Enter a valid email address');
      if (!password || password.length < 4) return toast('Password must be at least 4 characters');

      const btn = document.getElementById('emailSubmitBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Processing…'; }

      try {
        const res = await apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, name })
        });
        loginSuccess(res.profile);
      } catch (err) {
        // Fallback local sign in if backend endpoint is unavailable
        const displayName = name || (email.split('@')[0].charAt(0).toUpperCase() + email.split('@')[0].slice(1));
        loginSuccess({
          email,
          name: displayName,
          phone: '9876543210',
          address: 'Bespoke Atelier Resident, Main Road, Ranchi 834001',
          loggedInAt: new Date().toISOString()
        });
      }
    }

    // 1-Click Quick Demo Login
    function quickLogin(userKey) {
      const demoUsers = {
        priya: {
          name: 'Priya Sharma',
          phone: '9876543210',
          email: 'priya.sharma@example.com',
          address: 'Flat 402, Lotus Bloom Residences, Morabadi, Ranchi 834008',
          wallet: 450,
          points: 380
        },
        rahul: {
          name: 'Rahul Verma',
          phone: '9123456789',
          email: 'rahul.verma@example.com',
          address: 'Villa 12, Rosewood Enclave, Ranchi 834001',
          wallet: 250,
          points: 150
        }
      };

      const user = demoUsers[userKey] || demoUsers.priya;
      if (user.wallet) write('wallet', user.wallet);
      if (user.points) write('points', user.points);
      loginSuccess(user);
    }

    function loginSuccess(newProfile) {
      profile = newProfile;
      write('profile', profile);
      toast('Welcome back, ' + profile.name + ' 🌷');
      render();

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      setTimeout(() => {
        if (redirect === 'checkout') {
          window.location.href = '/?checkout=1';
        } else if (redirect) {
          window.location.href = redirect;
        } else {
          window.location.href = '/';
        }
      }, 900);
    }

    function signOutAccount() {
      profile = null;
      localStorage.removeItem('bb_profile');
      toast('Signed out successfully');
      render();
    }

    async function handleAdminSubmit() {
      const p = document.getElementById('adminPasswordInput')?.value.trim();
      if (!p) return toast('Please enter the admin password');
      const btn = document.getElementById('adminSubmitBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Authenticating...'; }
      try {
        const res = await apiRequest('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password: p })
        });
        localStorage.setItem('bb_admin_token', res.token);
        toast('Admin authenticated! Redirecting to Admin Console 👑');
        setTimeout(() => {
          window.location.href = '/admin';
        }, 600);
      } catch (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<span>Sign In to Admin Portal</span><span>⚡</span>'; }
        toast(err.message);
      }
    }

    function signOutAdmin() {
      localStorage.removeItem('bb_admin_token');
      toast('Signed out of Admin Console');
      render();
    }

    function returnToBoutique() {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (redirect === 'checkout') window.location.href = '/?checkout=1';
      else if (redirect) window.location.href = redirect;
      else window.location.href = '/';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Initial render
    render();
  </script>
</body>
</html>
